name: Deploy via FTP

# Auto-deploys on push to main by connecting to the server over FTP (explicit
# FTPS on port 21) and syncing the repo into public_html.
#
# Replaces the previous cPanel-API deploy. FTP on port 21 is confirmed reachable
# (FileZilla connects with explicit FTP over TLS); the FTP account's root is the
# cPanel home directory, so files are uploaded into public_html/.
#
# Requires three repository secrets:
#   FTP_SERVER   - e.g. ftp.chiefgrowthengineer.com
#   FTP_USERNAME - e.g. rob@chiefgrowthengineer.com
#   FTP_PASSWORD
#
# The action keeps a sync-state file on the server so subsequent deploys only
# transfer changed files, and it never deletes server files it didn't upload
# (cgi-bin, .well-known, etc. are safe).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to public_html
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy secrets are present
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi
          echo "All FTP secrets present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .gitignore
            .cpanel.yml
            README.md
            SETUP.sh
            docs/**
            node_modules/**
            **/.DS_Store
            **/*.log
